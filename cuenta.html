<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta</title>
    <!-- Link Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Link CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header-footer.css">
    <link rel="stylesheet" href="css/views/cuenta.css">
</head>

<body>
    <!-- Main (Contenido Principal) -->
    <div id="header-component"></div>
    <div class="section">
        <div class="card">
                <h2 >Iniciar sesión</h2>
                <hr>
                <p>STYLENOW MEMBER </p>
                <h1>Bienvenido</h1>
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="mail"><strong>Correo electrónico</strong>  </label>
                        <input type="email" id="mail" name="correo" placeholder="nombre@correo.cl" required>
                    </div>
                    <div class="form-group">
                        <label for="clave"><strong>Contraseña</strong> </label>
                        <input type="password" id="clave" name="clave" placeholder="********" required>
                    </div>
                    <div class="form-group">
                    <span> <a href="#">¿Olvidaste tu contraseña?</a> </span>
                    <button class="btn" type="submit"><bold>Ingresar</bold></button>
                    </div>
                </form>
                

        </div>

    </div>
    <div id="footer-component"></div>
    <script src="componentes.js"></script>
</body>

</html>
