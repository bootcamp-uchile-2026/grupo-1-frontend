<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>detalle-producto</title>
    <!-- Link Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Link CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header-footer.css">
    <link rel="stylesheet" href="css/views/detalle-producto.css">
</head>
<body>
    <!-- Main (Contenido Principal) -->
    <div id="header-component"></div>
    <main class="container">
        <!-- Galería de Imágenes -->
        <div class="gallery-container">
            <div class="main-image img-placeholder"></div>
            <div class="pics">
                <div class="minipics img-placeholder"></div>
                <div class="minipics img-placeholder"></div>
                <div class="minipics img-placeholder"></div>
                <div class="minipics img-placeholder"></div>
            </div>
        </div>

        <!-- Información del producto -->
        <div class="product-details">
            <p class="texto">Nuevo</p>
            <h2>Vestido Lino</h2>
            <h2>$29.990</h2>
            <div class="rating">
                <i class="fa-regular fa-star"></i>
                <i class="fa-regular fa-star"></i>
                <i class="fa-regular fa-star"></i>
                <i class="fa-regular fa-star"></i>
                <i class="fa-regular fa-star"></i>
            </div>

            <p class="texto">Vestido de lino ideal para días cálidos.</p>
            <div class="color">
                <p class="texto">Color: Beige</p>
                <div class="color-swatches">
                    <div class="swatch"></div>
                    <div class="swatch"></div>
                    <div class="swatch"></div>
                    <div class="swatch"></div>
                </div>
            </div>

            <p class="texto">Talla: M</p>
            <div class="size-options">
                <div class="size-btn">XS</div>
                <div class="size-btn">S</div>
                <div class="size-btn">M</div>
                <div class="size-btn">L</div>
                <div class="size-btn">XL</div>
            </div>
            <p class="texto">Guía de Tallas</p>

            <div class="actions">
                <button class="btn">AGREGAR AL CARRITO</button>
                <button class="btn btn-secondary">
                    <i class="fa-regular fa-heart"></i> AGREGAR A FAVORITOS
                </button>
            </div>

            <div class="extra-info">
                <div class="info-item">
                    <div class="icon-box">ícono</div>
                    <span>Envío a todo Chile</span>
                </div>
                <div class="info-item">
                    <div class="icon-box">ícono</div>
                    <span>Cambios fáciles hasta 30 días</span>
                </div>
                <div class="info-item">
                    <div class="icon-box">ícono</div>
                    <span>Pago seguro</span>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-component"></div>
    <script src="componentes.js"></script>
</body>
</html>
